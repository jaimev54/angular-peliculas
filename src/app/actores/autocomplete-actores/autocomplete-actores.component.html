<form>
    <mat-form-field>
        <input type="text" placeholder="Seleccione un actor" matInput [formControl]="control" [matAutocomplete]="auto"/>
        <mat-autocomplete #auto (optionSelected)="actorSeleccionado($event)">
            @for (actor of actores; track $index){
                <mat-option [value]="actor">
                    <img [src]="actor.foto" /> {{ actor.nombre }}
                </mat-option>
            }
        </mat-autocomplete>
    </mat-form-field>
</form>

@if (actoresSeleccionados.length > 0) {
    <table mat-table [dataSource]="actoresSeleccionados" class="mat-elevation-z8" cdkDropList [cdkDropListData]="actoresSeleccionados" (cdkDropListDropped)="finalizarArrastre($event)">
        <ng-container matColumnDef="imagen">
            <th mat-header-cell *matHeaderCellDef>Imagen</th>
            <td mat-cell *matCellDef="let actor">
                <img [src]="actor.foto" width="50" />
            </td>
        </ng-container>
        
        <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let actor"> {{ actor.nombre }} </td>
        </ng-container>

        <ng-container matColumnDef="personaje">
            <th mat-header-cell *matHeaderCellDef>Personaje</th>
            <td mat-cell *matCellDef="let actor">
                <mat-form-field appearance="outline" style="margin: 10px 0;">
                    <mat-label>Personaje</mat-label>
                    <input matInput [(ngModel)]="actor.personaje" [ngModelOptions]="{standalone: true}"/>
                </mat-form-field>
            </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let actor">
               <mat-icon mat-list-icon (click)="eliminar(actor)" style="cursor: pointer;">
                   delete
               </mat-icon>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnasAMostrar"></tr>
        <tr mat-row *matRowDef="let row; columns: columnasAMostrar" cdkDrag [cdkDragData]="row"></tr>
    </table>
}
