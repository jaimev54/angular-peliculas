<div style="max-width: 900px; margin: 0 auto; padding: 2rem;">
  <h2>{{ titulo }}</h2>
  <a [routerLink]="rutaCrear" mat-flat-button color="primary" style="margin-bottom: 1rem;">Crear nuevo</a>
  
  <div *ngIf="entidades.length === 0" style="text-align: center; padding: 2rem;">
    <p>No hay registros</p>
  </div>

  <table *ngIf="entidades.length > 0" style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr style="background-color: #f5f5f5;">
        <th *ngFor="let columna of columnasAMostrar" style="border: 1px solid #ddd; padding: 8px; text-align: left;">{{ columna }}</th>
        <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let entidad of entidades" style="border: 1px solid #ddd;">
        <td *ngFor="let columna of columnasAMostrar" style="border: 1px solid #ddd; padding: 8px;">{{ entidad[columna] }}</td>
        <td style="border: 1px solid #ddd; padding: 8px;">
          <button mat-flat-button color="accent" (click)="editarEntidad(entidad)" style="margin-right: 0.5rem;">Editar</button>
          <button
            mat-flat-button
            color="warn"
            [swal]="{
              title: '¿Eliminar?',
              text: 'Esta acción no se puede deshacer',
              icon: 'warning',
              showCancelButton: true,
              confirmButtonText: 'Sí, eliminar',
              cancelButtonText: 'Cancelar',
              confirmButtonColor: '#d33'
            }"
            (confirm)="eliminarEntidad(entidad)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <mat-paginator 
    [length]="cantidadTotalRegistros"
    [pageSize]="paginacion.recordsPorPagina"
    [pageIndex]="paginacion.pagina - 1"
    [pageSizeOptions]="[5, 10, 25, 50]"
    showFirstLastButtons
    (page)="actualizarPaginacion($event)">
  </mat-paginator>
</div>
